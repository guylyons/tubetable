<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#55585c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint, so Dark and Light do not flash the Grey default.
      try {
        const theme = localStorage.getItem("tubetable.theme.v1");
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <meta name="description" content="Tubetable turns YouTube clips into a small, playable mixing table." />
    <title>Tubetable | YouTube Mixing Table</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
